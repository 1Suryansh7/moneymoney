# Stage 0 orchestration. `app` (base target) is the verified gate: every
# `make` target runs here. `app-eda` is the declared-but-unverified full
# toolchain; it activates only via `--profile eda` after the EDA follow-up
# proves the build (see docs/stage-0-layered-debt.md).
services:
  app:
    build:
      context: .
      target: base
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/scripts
    volumes:
      - .:/workspace:cached
    user: "${UID:-1000}:${GID:-1000}"

  app-eda:
    profiles: ["eda"]
    # No build.args here by design: the Dockerfile's frozen OPEN_PDKS_GIT_REF
    # default is the single source of truth. Override explicitly when needed:
    #   OPEN_PDKS_GIT_REF=<sha> docker compose --profile eda build app-eda
    # (A previous revision passed ${OPEN_PDKS_GIT_REF:-UNPINNED} here, which
    # stomped the frozen default with UNPINNED and tripped the guard — the
    # fail-closed mechanism worked exactly as designed.)
    build:
      context: .
      target: eda
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/scripts
    volumes:
      - .:/workspace:cached
    user: "${UID:-1000}:${GID:-1000}"
