# Stage 0 pre-commit: local hooks only (no pinned remote revs to hallucinate,
# no network at commit time). Uses the pinned dev environment from pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: python -m ruff check .
        language: system
        types: [python]
      - id: mypy-strict
        name: mypy strict
        entry: python -m mypy .
        language: system
        types: [python]
        pass_filenames: false
